<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Gloss · dock</title>
  <link rel="stylesheet" href="/gloss.css" />
  <script src="/gloss.js"></script>
</head>
<body>
  <header class="mast">
    <div class="mast-id">
      <div class="wordmark"><b>Gloss</b> dock</div>
      <div class="tagline">Marginal readings of the live tape.</div>
    </div>
    <div class="chips">
      <span class="chip">judge <span id="mode">fixture</span></span>
      <span class="chip">channel <span id="channel">local</span></span>
      <span class="chip cite">glass <span id="cite">□</span></span>
    </div>
  </header>
  <main class="shell">
    <section class="stage" aria-label="Live readings">
      <div class="tape" aria-hidden="true"></div>
      <div class="window-gate" id="gate" aria-hidden="true">
        <div class="gate-label">window<b id="gatefacts">no facts</b></div>
      </div>
      <div class="stage-head">
        <h1>Live readings</h1>
        <span class="meta" id="count">0 of 3</span>
      </div>
      <div id="live" class="stagger"></div>
    </section>
    <aside class="margin">
      <div class="panel">
        <h2>Line</h2>
        <input id="user" value="chat" aria-label="user" />
        <textarea id="text" rows="4" placeholder="one allegation, or a burst — one line each"></textarea>
        <div class="row">
          <button id="send" class="primary">Pulse</button>
          <button id="scout">Scout</button>
        </div>
      </div>
      <div class="panel">
        <h2>Window facts</h2>
        <textarea id="facts" rows="3" placeholder="empty = no Bound"></textarea>
        <input id="utter" placeholder="streamer utterance" />
        <label class="meta"><input id="glass" type="checkbox" /> Margin Glass</label>
        <div class="row">
          <input id="clock" class="mono" placeholder="clock_ns" />
          <input id="frame" class="mono" placeholder="frame_seq" />
        </div>
        <button id="window" class="primary">Tap window</button>
      </div>
      <div class="panel">
        <h2>Session</h2>
        <div class="row">
          <button id="xtape">X tape</button>
          <button id="citeq">Cite Q</button>
          <button id="close" class="quiet">Close session</button>
          <button id="fresh" class="quiet">New session</button>
        </div>
      </div>
      <div class="panel">
        <h2>Folio</h2>
        <div id="folio"></div>
      </div>
    </aside>
  </main>
  <footer class="mast" id="foot">Three live readings. No crown. Tape is the text.</footer>
  <script>
    const liveEl = document.getElementById("live");
    const folioEl = document.getElementById("folio");
    const plates = Gloss.tracker();
    async function api(path, body) {
      const res = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const view = await res.json();
      if (!res.ok) throw new Error(view.error || res.status);
      return view;
    }
    const escapeHtml = Gloss.esc;
    function card(r) {
      const pct = Math.round((r.concentration || 0) * 100);
      const hold = r.mark === "hold"
        ? ""
        : `<button class="holdbtn" data-hold="${escapeHtml(r.id)}">Hold</button>`;
      return `<article class="card ${escapeHtml(r.mark)}${plates.motion(r)}" data-id="${escapeHtml(r.id)}">
        <i class="press" aria-hidden="true"></i>
        <div class="mark ${escapeHtml(r.mark)}">${escapeHtml(r.mark)}</div>
        <div class="label">${escapeHtml(r.label)}</div>
        <div class="meta">${escapeHtml(r.type)}${r.echoOf ? '<span class="sep">·</span>echo' : ""}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        ${hold}
      </article>`;
    }
    function render(view) {
      document.getElementById("mode").textContent = view.judge;
      document.getElementById("channel").textContent = view.channel;
      const cite = document.getElementById("cite");
      if (cite) cite.textContent = view.citation ? `f${view.citation.frame_seq}` : "□";
      const glassEl = document.getElementById("glass");
      if (glassEl) glassEl.checked = !!view.glass;
      const foot = document.getElementById("foot");
      if (foot) {
        const g = view.glass ? "glass on" : "glass off";
        const c = view.citation ? `f${view.citation.frame_seq}` : "□";
        const scout = view.scouted != null ? ` · scouted ${view.scouted}` : "";
        foot.textContent = `${g} · ${c} · ${view.live.length} live${scout}`;
      }
      const facts = view.window && String(view.window.facts || "").trim();
      const secs = view.window ? Math.round((view.window.lengthMs || 0) / 1000) : 0;
      document.getElementById("gate").classList.toggle("has-facts", !!facts);
      document.getElementById("gatefacts").textContent = (secs ? `${secs}s · ` : "") + (facts ? "facts" : "no facts");
      document.getElementById("count").textContent = `${view.live.length} of 3`;
      if (plates.changed(Gloss.keyOf(view.live))) {
        const vacant = Math.max(0, 3 - view.live.length);
        liveEl.innerHTML = view.live.length
          ? view.live.map(card).join("") + '<div class="slot">vacant</div>'.repeat(vacant)
          : '<div class="empty">□ no live readings</div>';
        plates.commit(view.live);
        liveEl.querySelectorAll("[data-hold]").forEach((btn) => {
          btn.onclick = async () => render(await api("/v1/hold", { id: btn.getAttribute("data-hold") }));
        });
      }
      folioEl.innerHTML = view.folio.slice(-6).reverse().map((r) =>
        `<div class="folio-row"><span class="mark ${escapeHtml(r.mark)}">${escapeHtml(r.mark)}</span><span class="txt">${escapeHtml(r.label)}</span></div>`
      ).join("") || '<div class="meta">empty</div>';
    }
    async function refresh() { render(await api("/v1/rail")); }
    document.getElementById("send").onclick = async () => {
      render(await api("/v1/line", {
        text: document.getElementById("text").value,
        user: document.getElementById("user").value,
      }));
      document.getElementById("text").value = "";
    };
    document.getElementById("scout").onclick = async () => {
      render(await api("/v1/scout", {
        text: document.getElementById("text").value,
        user: document.getElementById("user").value,
      }));
      document.getElementById("text").value = "";
    };
    document.getElementById("window").onclick = async () => {
      try {
        render(await api("/v1/window", {
          glass: document.getElementById("glass").checked,
          facts: document.getElementById("facts").value,
          streamerUtterance: document.getElementById("utter").value,
          startedMs: Date.now(),
          clock_ns: document.getElementById("clock").value,
          frame_seq: document.getElementById("frame").value,
        }));
      } catch (err) {
        document.getElementById("foot").textContent = String(err.message || err);
      }
    };
    document.getElementById("close").onclick = async () => render(await api("/v1/close", {}));
    document.getElementById("xtape").onclick = async () =>
      render(await api("/v1/ingest", { fixture: "x-session", channel: "x" }));
    document.getElementById("citeq").onclick = async () => {
      try { render(await api("/v1/cite", { fixture: "qoresence-window" })); }
      catch (err) { document.getElementById("foot").textContent = String(err.message || err); }
    };
    document.getElementById("fresh").onclick = async () => render(await api("/v1/session", { channel: "local" }));
    refresh();
  </script>
</body>
</html>
