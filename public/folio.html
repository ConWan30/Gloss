<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=318" />
  <title>Gloss · folio</title>
  <link rel="stylesheet" href="/gloss.css" />
</head>
<body>
  <div class="narrow">
    <div class="wordmark"><b>Gloss</b> folio</div>
    <div id="root"><div class="empty">□</div></div>
  </div>
  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    async function tick() {
      const view = await fetch("/v1/folio").then((r) => r.json());
      const root = document.getElementById("root");
      const cite = view.citation ? ` · f${view.citation.frame_seq}` : " · □";
      document.querySelector(".wordmark").innerHTML = "<b>Gloss</b> folio" + cite;
      if (!view.folio.length) {
        root.innerHTML = '<div class="empty">□ no folio</div>';
        return;
      }
      root.innerHTML = view.folio.map((r) =>
        `<div class="card ${escapeHtml(r.mark)}"><div class="mark ${escapeHtml(r.mark)}">${escapeHtml(r.mark)}</div><div class="label">${escapeHtml(r.label)}</div></div>`
      ).join("");
    }
    tick();
    setInterval(tick, 4000);
  </script>
</body>
</html>
