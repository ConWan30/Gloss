<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=318" />
  <title>Gloss · second</title>
  <link rel="stylesheet" href="/gloss.css" />
</head>
<body>
  <div class="narrow">
    <div class="wordmark"><b>Gloss</b> second</div>
    <div id="root"><div class="empty">□</div></div>
  </div>
  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    async function api(path, body) {
      const res = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    }
    function draw(view) {
      const root = document.getElementById("root");
      if (!view.live || !view.live.length) {
        root.innerHTML = '<div class="empty">□ no live readings</div>';
        return;
      }
      root.innerHTML = view.live.map((r) =>
        `<div class="card ${escapeHtml(r.mark)}">` +
        `<div class="mark ${escapeHtml(r.mark)}">${escapeHtml(r.mark)}</div>` +
        `<div class="label">${escapeHtml(r.label)}</div>` +
        `<button class="holdbtn" data-id="${escapeHtml(r.id)}">Second</button>` +
        `</div>`
      ).join("");
      root.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.onclick = async () => draw(await api("/v1/second", { id: btn.getAttribute("data-id"), user: "viewer" }));
      });
    }
    async function tick() { draw(await api("/v1/rail")); }
    tick();
    setInterval(tick, 4000);
  </script>
</body>
</html>
