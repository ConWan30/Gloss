<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=318" />
  <link rel="icon" href="data:," />
  <title>Gloss · second</title>
  <link rel="stylesheet" href="/gloss.css" />
  <script src="/gloss.js"></script>
</head>
<body>
  <div class="narrow">
    <div class="tape" aria-hidden="true"></div>
    <div class="narrow-head">
      <div class="wordmark"><b>Gloss</b> second</div>
      <div class="tagline">Bind to a live reading. Not a vote.</div>
    </div>
    <div id="root" class="stagger"><div class="empty">□</div></div>
  </div>
  <script>
    const plates = Gloss.tracker();
    const seconded = new Set();
    async function api(path, body) {
      const res = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    }
    function draw(view, force) {
      const root = document.getElementById("root");
      const live = view.live || [];
      const key = Gloss.keyOf(live) + [...seconded].join(",");
      if (!plates.changed(key) && !force) return;
      if (!live.length) {
        root.innerHTML = '<div class="empty">□ no live readings</div>';
        plates.commit(live);
        return;
      }
      root.innerHTML = live.map((r) => {
        const done = seconded.has(r.id);
        const btn = `<button class="holdbtn second${done ? " is-seconded" : ""}" data-id="${Gloss.esc(r.id)}">${done ? "Seconded" : "Second"}</button>`;
        return Gloss.slip(r, plates.motion(r), btn);
      }).join("");
      plates.commit(live);
      root.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-id");
          const view = await api("/v1/second", { id, user: "viewer" });
          seconded.add(id);
          draw(view);
        };
      });
    }
    async function tick() { draw(await api("/v1/rail")); }
    tick();
    setInterval(tick, 4000);
  </script>
</body>
</html>
